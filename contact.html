    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<body>

    <nav>
        <div class="logo">POOJA.</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="education.html">Education</a>
            <a href="certifications.html">Certificates</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <main>
        <section class="contact-page">
            <div class="section-title">
                <h2 class="reveal">Get In Touch</h2>
                <div class="line reveal"></div>
            </div>

            <div class="contact-grid">
                <div class="contact-info reveal">
                    <h3>Let's collaborate.</h3>
                    <p>I'm always open to discussing new projects, creative ideas, or opportunities to be part of your vision.</p>
                    
                    <div class="contact-methods">
                        <a href="mailto:Ojapo671@gmail.com" class="method">
                            <div class="method-icon">✉</div>
                            <div class="method-text">
                                <span>Email Me</span>
                                <p>Ojapo671@gmail.com</p>
                            </div>
                        </a>
                        <a href="tel:+919986023360" class="method">
                            <div class="method-icon">📞</div>
                            <div class="method-text">
                                <span>Call Me</span>
                                <p>+91 9986023360</p>
                            </div>
                        </a>
                    </div>
                </div>

                <form class="contact-form reveal">
                    <div class="form-group">
                        <input type="text" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <textarea placeholder="Your Message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
